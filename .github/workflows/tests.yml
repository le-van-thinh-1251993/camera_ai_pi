name: tests
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q app scripts
      - run: python -m pip install ruff==0.17.3
      - run: python -m ruff check app scripts tests
      - run: python -m ruff format --check app scripts tests
      - run: python -m unittest discover -s tests/v6 -v
      - run: python -m unittest discover -s tests -p test_counter.py -v
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run format:check
